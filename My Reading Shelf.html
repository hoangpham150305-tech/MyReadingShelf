<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Reading Shelf</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceef5;--surface:#fff;--ink:#1c1e30;--muted:#5d6179;--line:#d5d8e6;--accent:#c2255c;--accent-ink:#fff;
--s-reading:#1c7ed6;--s-completed:#2b8a3e;--s-plan:#7048e8;--s-hold:#e67700;--s-dropped:#c92a2a;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14151f;--surface:#1e2030;--ink:#eceef8;--muted:#9a9fb8;--line:#33364d;--accent:#f06595;--accent-ink:#1c1e30;
--s-reading:#74c0fc;--s-completed:#69db7c;--s-plan:#b197fc;--s-hold:#ffa94d;--s-dropped:#ff8787;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14151f;--surface:#1e2030;--ink:#eceef8;--muted:#9a9fb8;--line:#33364d;--accent:#f06595;--accent-ink:#1c1e30;
--s-reading:#74c0fc;--s-completed:#69db7c;--s-plan:#b197fc;--s-hold:#ffa94d;--s-dropped:#ff8787;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:980px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:800;letter-spacing:-.02em;margin:8px 0 4px;line-height:1.05}
.sub{color:var(--muted);margin:0 0 20px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
input,select,textarea,button{font:inherit;color:var(--ink)}
input[type=search],select,.f input,.f select,.f textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
.bar input[type=search]{flex:1 1 200px;width:auto}.bar select{width:auto}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.danger{color:var(--s-dropped)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.tabs button{white-space:nowrap;border-radius:99px;padding:6px 13px;font-size:.9rem}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c,var(--line));border-radius:10px;padding:14px 16px}
.card h2{margin:0;font-size:1.25rem;font-weight:700;line-height:1.2}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tag{font-size:.8rem;border:1px solid var(--line);border-radius:99px;padding:1px 9px;color:var(--muted)}
.tag.st{color:var(--c);border-color:var(--c);font-weight:600}
.desc{margin:6px 0 10px;color:var(--muted);max-width:70ch;white-space:pre-wrap}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.links a{font-size:.85rem;color:var(--accent);text-decoration:underline;text-underline-offset:3px;word-break:break-all}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row button{padding:5px 11px;font-size:.85rem}
.row select{width:auto;padding:5px 8px;font-size:.85rem}
.empty{text-align:center;color:var(--muted);padding:48px 12px;border:1px dashed var(--line);border-radius:10px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);width:min(560px,94vw);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.f{display:grid;gap:12px}.f label{display:grid;gap:4px;font-weight:600;font-size:.9rem}
.f .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f textarea{min-height:80px;resize:vertical}
.hint{font-weight:400;color:var(--muted);font-size:.8rem}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:.9rem}
.card{display:grid;grid-template-columns:auto 1fr;gap:14px}
.cw{width:96px;height:136px;overflow:hidden;border-radius:6px;background:var(--line);display:grid;place-items:center}
.cw img{width:100%;height:100%;object-fit:cover;display:block}
.noc{color:var(--muted);font-size:.75rem;text-align:center}
.secret .cw img{filter:blur(16px);transition:filter .2s}.secret .cw:hover img{filter:none}
.pv{display:flex;gap:10px;align-items:center}.pv img{width:64px;height:90px;object-fit:cover;border-radius:6px}
.tabs.shelves button{font-weight:600}
@media (max-width:480px){.cw{width:72px;height:102px}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>
</head>
<body>
<main>
  <h1>My Reading Shelf</h1>
  <p class="sub" id="sub"></p>
  <div class="tabs shelves" id="shelves" role="group" aria-label="Shelf"></div>
  <div class="bar">
    <input type="search" id="q" placeholder="Search title or description" aria-label="Search">
    <select id="type" aria-label="Filter by type"></select>
    <select id="sort" aria-label="Sort"><option value="added">Newest added</option><option value="title">Title A–Z</option></select>
    <button class="primary" id="add">Add title</button>
  </div>
  <div class="tabs" id="tabs" role="group" aria-label="Reading status"></div>
  <div class="list" id="list"></div>
  <div class="row" style="margin-top:24px">
    <button id="export">Export backup</button>
    <button id="import">Import backup</button>
    <input type="file" id="file" accept="application/json" hidden>
    <span class="hint" id="count"></span>
  </div>
</main>

<dialog id="pin"><form class="f" id="pinform" method="dialog"><label><span id="pin-msg"></span><input type="password" id="pin-in" autocomplete="off" minlength="4" required></label><div class="row" style="justify-content:flex-end"><button type="button" id="pin-x">Cancel</button><button type="submit" class="primary">Unlock</button></div></form></dialog>

<dialog id="dlg">
  <form class="f" id="form" method="dialog">
    <label>Title<input id="f-title" required maxlength="200"></label>
    <div class="two">
      <label>Type<select id="f-type"></select></label>
      <label>Publication status<select id="f-pub"><option>Ongoing</option><option>Completed</option><option>Hiatus</option><option>Cancelled</option></select></label>
    </div>
    <div class="two">
      <label>Reading status<select id="f-read"></select></label>
      <label><span id="l-ch">Chapters read</span><input id="f-ch" placeholder="e.g. 120 / 180"></label>
    </div>
    <div style="display:grid;gap:6px"><span style="font-weight:600;font-size:.9rem">Cover</span><div class="pv"><img id="pv" alt="" hidden><div class="row"><button type="button" id="pick">Choose image</button><button type="button" id="rmc" class="danger" hidden>Remove</button></div></div><span class="hint">Or copy an image and press Ctrl+V while this window is open.</span><input type="file" id="cfile" accept="image/*" hidden></div>
    <label>Description<textarea id="f-desc"></textarea></label>
    <label>Where to read <span class="hint">One link per line. Add a name first if you like: MangaDex https://…</span><textarea id="f-links"></textarea></label>
    <div class="row" style="justify-content:flex-end">
      <button type="button" id="cancel">Cancel</button>
      <button type="submit" class="primary">Save title</button>
    </div>
  </form>
</dialog>

<script>
const READ=[["reading","Reading","--s-reading"],["completed","Completed","--s-completed"],["plan","Plan to read","--s-plan"],["hold","On hold","--s-hold"],["dropped","Dropped","--s-dropped"]];
const KEY="reading-shelf-v1";
let items=[],filter="all",editId=null,shelf="lib";
const $=id=>document.getElementById(id);
function load(){try{items=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){items=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){toast("Couldn’t save in this browser. Export a backup.")}}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function parseLinks(txt){return txt.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/https?:\/\/\S+/);if(!m)return null;const url=m[0];let name=l.replace(url,"").trim();if(!name){try{name=new URL(url).hostname.replace(/^www\./,"")}catch(e){name=url}}return{name,url}}).filter(Boolean)}
$("f-read").innerHTML=READ.map(r=>`<option value="${r[0]}">${r[1]}</option>`).join("");
function renderTabs(){chrome();
  const m=mine(),counts={all:m.length};READ.forEach(r=>counts[r[0]]=m.filter(i=>i.read===r[0]).length);
  $("tabs").innerHTML=[["all","All"],...READ].map(r=>`<button data-f="${r[0]}" aria-pressed="${filter===r[0]}">${lab(r)} (${counts[r[0]]})</button>`).join("");
}
function render(){
  renderTabs();
  const q=$("q").value.toLowerCase(),ty=$("type").value;
  let list=items.filter(i=>(i.shelf||"lib")===shelf&&(filter==="all"||i.read===filter)&&(!ty||i.type===ty)&&(!q||(i.title+" "+i.desc).toLowerCase().includes(q)));
  list.sort($("sort").value==="title"?(a,b)=>a.title.localeCompare(b.title):(a,b)=>b.added-a.added);
  $("count").textContent=list.length+" of "+mine().length+" shown";
  if(!list.length){$("list").innerHTML=`<div class="empty">${mine().length?"Nothing matches these filters.":"Your shelf is empty. Press “Add title” to save your first one."}</div>`;return}
  $("list").innerHTML=list.map(i=>{
    const r=READ.find(x=>x[0]===i.read)||READ[2];
    const links=(i.links||[]).map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.name)}</a>`).join("");
    return `<article class="card ${shelf==="secret"?"secret":""}" style="--c:var(${r[2]})"><div class="cw">${i.cover?`<img src="${i.cover}" alt="Cover of ${esc(i.title)}">`:'<span class="noc">No cover</span>'}</div><div>
      <h2>${esc(i.title)}</h2>
      <div class="meta"><span class="tag st">${lab(r)}</span><span class="tag">${esc(i.type)}</span><span class="tag">${esc(i.pub)}</span>${i.ch?`<span class="tag">${shelf==="anime"?"Ep.":"Ch."} ${esc(i.ch)}</span>`:""}</div>
      ${i.desc?`<p class="desc">${esc(i.desc)}</p>`:""}
      ${links?`<div class="links">${links}</div>`:""}
      <div class="row"><select data-id="${i.id}" aria-label="Change reading status">${READ.map(x=>`<option value="${x[0]}"${x[0]===i.read?" selected":""}>${lab(x)}</option>`).join("")}</select>
      <button data-edit="${i.id}">Edit</button><button class="danger" data-del="${i.id}">Delete</button></div></div>
    </article>`}).join("");
}
function openForm(id){
  editId=id;const i=items.find(x=>x.id===id)||{};fillTypes();cover=i.cover||"";pv();
  $("f-title").value=i.title||"";$("f-type").value=i.type||TYPES[shelf][0];$("f-pub").value=i.pub||"Ongoing";
  $("f-read").value=i.read||"reading";$("f-ch").value=i.ch||"";$("f-desc").value=i.desc||"";
  $("f-links").value=(i.links||[]).map(l=>l.name+" "+l.url).join("\n");
  $("dlg").showModal();$("f-title").focus();
}
$("add").onclick=()=>openForm(null);
$("cancel").onclick=()=>$("dlg").close();
$("form").onsubmit=e=>{
  const d={title:$("f-title").value.trim(),type:$("f-type").value,pub:$("f-pub").value,read:$("f-read").value,ch:$("f-ch").value.trim(),desc:$("f-desc").value.trim(),links:parseLinks($("f-links").value),cover};
  if(editId){Object.assign(items.find(x=>x.id===editId),d)}else{items.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),added:Date.now(),shelf,...d})}
  save();render();toast("Title saved");
};
$("tabs").onclick=e=>{const b=e.target.closest("button");if(b){filter=b.dataset.f;render()}};
$("list").onclick=e=>{
  const ed=e.target.closest("[data-edit]"),dl=e.target.closest("[data-del]");
  if(ed)openForm(ed.dataset.edit);
  if(dl&&confirm("Delete this title?")){items=items.filter(x=>x.id!==dl.dataset.del);save();render();toast("Title deleted")}
};
$("list").onchange=e=>{const s=e.target.closest("select[data-id]");if(s){items.find(x=>x.id===s.dataset.id).read=s.value;save();render()}};
["q","type","sort"].forEach(id=>$(id).addEventListener("input",render));
$("export").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(items,null,2)],{type:"application/json"}));a.download="reading-shelf-backup.json";a.click()};
$("import").onclick=()=>$("file").click();
$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;const ids=new Set(items.map(x=>x.id));d.forEach(x=>{if(x&&x.title&&!ids.has(x.id))items.push(x)});save();render();toast("Backup imported")}catch(err){toast("That file isn’t a valid backup")}};r.readAsText(f);e.target.value=""};
const TYPES={lib:["Manga","Manhwa","Manhua"],anime:["TV series","Movie","OVA/ONA"],secret:["Manga","Manhwa","Manhua","Other"]};
const NAMES={lib:"Manga",anime:"Anime",secret:"Secret"};
const SUBS={lib:"Every manga, manhwa and manhua you’ve read, in one place.",anime:"Every anime you’ve watched or plan to watch.",secret:"Private shelf. It locks again when you leave it."};
const lab=r=>shelf==="anime"&&r[0]==="reading"?"Watching":r[1];
const mine=()=>items.filter(i=>(i.shelf||"lib")===shelf);
let cover="";
function fillTypes(){
  $("f-type").innerHTML=TYPES[shelf].map(t=>`<option>${t}</option>`).join("");
  $("f-read").innerHTML=READ.map(r=>`<option value="${r[0]}">${lab(r)}</option>`).join("");
  $("l-ch").textContent=shelf==="anime"?"Episodes watched":"Chapters read";
}
function chrome(){
  if(chrome.s!==shelf){chrome.s=shelf;$("type").innerHTML='<option value="">All types</option>'+TYPES[shelf].map(t=>`<option>${t}</option>`).join("")}
  $("sub").textContent=SUBS[shelf];
  $("shelves").innerHTML=Object.keys(NAMES).map(k=>`<button data-s="${k}" aria-pressed="${shelf===k}">${NAMES[k]}</button>`).join("");
}
function go(s){shelf=s;filter="all";$("q").value="";render()}
$("shelves").onclick=e=>{const b=e.target.closest("button");if(!b||b.dataset.s===shelf)return;b.dataset.s==="secret"?askPin():go(b.dataset.s)};
document.addEventListener("visibilitychange",()=>{if(document.hidden&&shelf==="secret")go("lib")});
async function sha(t){if(!(window.crypto&&crypto.subtle)){let h=5381;for(const c of "shelf:"+t)h=(h*33^c.charCodeAt(0))>>>0;return String(h)}const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("shelf:"+t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function getPin(){try{return localStorage.getItem(KEY+"-pin")}catch(e){return null}}
function askPin(){$("pin-msg").textContent=getPin()?"Enter your PIN":"Create a PIN (4+ characters) for this shelf";$("pin-in").value="";$("pin").showModal();$("pin-in").focus()}
$("pin-x").onclick=()=>$("pin").close();
$("pinform").onsubmit=async e=>{e.preventDefault();const h=await sha($("pin-in").value),has=getPin();
  if(!has){try{localStorage.setItem(KEY+"-pin",h)}catch(x){}}else if(has!==h){toast("Wrong PIN");$("pin-in").value="";return}
  $("pin").close();go("secret")};
function pv(){$("pv").hidden=!cover;if(cover)$("pv").src=cover;$("rmc").hidden=!cover}
function setCover(file){if(!file||!file.type.startsWith("image/"))return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const w=Math.min(300,im.width),h=Math.round(im.height*w/im.width),c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);cover=c.toDataURL("image/jpeg",.75);pv()};im.src=r.result};r.readAsDataURL(file)}
$("pick").onclick=()=>$("cfile").click();
$("cfile").onchange=e=>{setCover(e.target.files[0]);e.target.value=""};
$("rmc").onclick=()=>{cover="";pv()};
document.addEventListener("paste",e=>{if(!$("dlg").open)return;const f=[...e.clipboardData.files].find(x=>x.type.startsWith("image/"));if(f)setCover(f)});
load();render();
</script>
</body>
</html>
